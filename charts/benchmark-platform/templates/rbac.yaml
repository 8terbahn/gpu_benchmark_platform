---
# ServiceAccount for the Operator
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "benchmark-platform.serviceAccountName" . }}
  labels:
    {{- include "benchmark-platform.labels" . | nindent 4 }}
{{- end }}

---
# ClusterRole grants the operator read/write access to BenchmarkJob CRs
# and read access to Namespaces (for health checks).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "benchmark-platform.fullname" . }}-operator-role
  labels:
    {{- include "benchmark-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [benchmarks.gpu-platform.io]
    resources: [benchmarkjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [benchmarks.gpu-platform.io]
    resources: [benchmarkjobs/status]
    verbs: [get, update, patch]
  - apiGroups: [benchmarks.gpu-platform.io]
    resources: [benchmarkjobs/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]

---
# ClusterRoleBinding – binds the operator ServiceAccount to its ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "benchmark-platform.fullname" . }}-operator-rolebinding
  labels:
    {{- include "benchmark-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "benchmark-platform.fullname" . }}-operator-role
subjects:
  - kind: ServiceAccount
    name: {{ include "benchmark-platform.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
