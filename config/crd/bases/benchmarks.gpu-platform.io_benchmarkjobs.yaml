---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: benchmarkjobs.benchmarks.gpu-platform.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
spec:
  group: benchmarks.gpu-platform.io
  names:
    kind: BenchmarkJob
    listKind: BenchmarkJobList
    plural: benchmarkjobs
    singular: benchmarkjob
    shortNames:
      - bj
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: GPU
          type: string
          jsonPath: .spec.gpuModel
        - name: Workload
          type: string
          jsonPath: .spec.workloadType
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Throughput
          type: number
          jsonPath: .status.throughput
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [gpuModel, workloadType, batchSize]
              properties:
                gpuModel:
                  type: string
                  enum: [T4, V100, A100, H100, L40S, RTX4090]
                  description: GPU model to benchmark.
                workloadType:
                  type: string
                  enum: [inference, training]
                  description: Benchmark workload class.
                batchSize:
                  type: integer
                  minimum: 1
                  maximum: 1024
                  description: Batch size dimension for the benchmark.
                schedulerAPIURL:
                  type: string
                  default: "http://gpu-benchmark-api.gpu-benchmark.svc.cluster.local:8000"
                  description: Base URL of the Python FastAPI benchmark service.
                maxRetries:
                  type: integer
                  default: 3
                  minimum: 0
                  maximum: 10
                  description: Maximum retry attempts before transitioning to Failed.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Submitted, Running, Completed, Failed]
                jobID:
                  type: string
                message:
                  type: string
                retryCount:
                  type: integer
                throughput:
                  type: number
                  description: Measured samples/second (set on Completed).
                latencyMs:
                  type: number
                  description: Measured latency in milliseconds (set on Completed).
                memoryBandwidthGbps:
                  type: number
                  description: Measured GPU memory bandwidth in GB/s (set on Completed).
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
