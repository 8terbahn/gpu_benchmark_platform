---
# GitHub Actions CI/CD Pipeline – GPU Benchmark Platform
#
# Stages:
#   1. lint    – Go (golangci-lint) + Python (ruff/flake8)
#   2. test    – Go envtest integration tests + Python pytest
#   3. build   – Docker multi-stage: operator image + API/worker image
#   4. scan    – Trivy vulnerability scan (CRITICAL/HIGH blocks merge)
#   5. chart   – Helm lint + template render
#   6. e2e     – Kind cluster: CRDs, deploy chart, submit BenchmarkJob, assert Completed phase
name: CI/CD

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

env:
  GO_VERSION:       "1.22"
  PYTHON_VERSION:   "3.11"
  REGISTRY:         ghcr.io
  OPERATOR_IMAGE:   ghcr.io/${{ github.repository }}/operator
  API_IMAGE:        ghcr.io/${{ github.repository }}/api
  PROVIDER_IMAGE:   ghcr.io/${{ github.repository }}/provider

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint (operator)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: operator
          args: --timeout=5m

      - name: golangci-lint (provider)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: provider
          args: --timeout=5m

      - name: golangci-lint (Crossplane function)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: crossplane/functions/benchmark-sizing
          args: --timeout=5m

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python lint (ruff)
        run: |
          pip install ruff
          ruff check backend/

  # ── 2. Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Set KUBEBUILDER_ASSETS
        run: echo "KUBEBUILDER_ASSETS=$(setup-envtest use --print path 1.31.x)" >> $GITHUB_ENV

      - name: Run operator tests
        working-directory: operator
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic -timeout=5m -v

      - name: Enforce 70% coverage
        working-directory: operator
        run: |
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3,1,length($3)-1)}')
          echo "Coverage: $COV%"
          awk "BEGIN { if ($COV < 70) { print \"Coverage $COV% below 70%\"; exit 1 } }"

      - uses: codecov/codecov-action@v4
        with:
          files: operator/coverage.out

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Python tests
        run: |
          pip install -r backend/requirements.txt
          pytest backend/tests -q --tb=short

  # ── 3. Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push – operator
        uses: docker/build-push-action@v6
        with:
          context: operator
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.OPERATOR_IMAGE }}:${{ github.sha }}
            ${{ env.OPERATOR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push – provider
        uses: docker/build-push-action@v6
        with:
          context: provider
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.PROVIDER_IMAGE }}:${{ github.sha }}
            ${{ env.PROVIDER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push – Python API/worker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

  # ── 4. Security Scan ──────────────────────────────────────────────────────────
  scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Trivy – operator image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.OPERATOR_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-operator.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-operator.sarif
        if: always()

  # ── 5. Helm Chart ─────────────────────────────────────────────────────────────
  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Lint chart
        run: helm lint charts/benchmark-platform

      - name: Template render test
        run: |
          helm template benchmark-platform charts/benchmark-platform \
            --set operator.image.tag=${{ github.sha }} \
            --set provider.image.tag=${{ github.sha }} \
            --set api.image.tag=${{ github.sha }} \
            > /dev/null

  # ── 6. E2E on Kind ────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Kind)
    runs-on: ubuntu-latest
    needs: [build, helm]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: benchmark-platform-e2e

      - name: Install CRDs
        run: kubectl apply -f config/crd/bases/

      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm install kyverno kyverno/kyverno -n kyverno --create-namespace --wait

      - name: Deploy chart
        run: |
          helm install benchmark-platform charts/benchmark-platform \
            --namespace gpu-benchmark --create-namespace \
            --set operator.image.tag=${{ github.sha }} \
            --set provider.image.tag=${{ github.sha }} \
            --set api.image.tag=${{ github.sha }} \
            --set redis.enabled=false \
            --set postgres.enabled=false \
            --wait --timeout=120s

      - name: Apply Kyverno policies
        run: kubectl apply -f policies/kyverno/

      - name: Submit test BenchmarkJob
        run: |
          kubectl apply -f - <<EOF
          apiVersion: benchmarks.gpu-platform.io/v1alpha1
          kind: BenchmarkJob
          metadata:
            name: e2e-h100-inference
            namespace: gpu-benchmark
            labels:
              gpu-platform.io/cost-center: CC-0001
              gpu-platform.io/owner: e2e-test
          spec:
            gpuModel: H100
            workloadType: inference
            batchSize: 32
          EOF

      - name: Assert BenchmarkJob reaches Completed phase
        run: |
          kubectl wait benchmarkjob/e2e-h100-inference \
            --for=jsonpath='{.status.phase}'=Completed \
            --namespace gpu-benchmark \
            --timeout=120s

      - name: Assert throughput result is present
        run: |
          THROUGHPUT=$(kubectl get benchmarkjob e2e-h100-inference \
            -n gpu-benchmark -o jsonpath='{.status.throughput}')
          [ -n "$THROUGHPUT" ] || (echo "Expected throughput to be set"; exit 1)
          echo "Benchmark throughput: $THROUGHPUT samples/sec"
